name: Gerar Estatísticas do Perfil

on:
  schedule:
    - cron: '0 0 * * *' # Roda automaticamente todo dia à meia-noite
  workflow_dispatch: # Permite que você clique em um botão para rodar manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Repositório
        uses: actions/checkout@v4

      - name: Baixar Gráfico de Status
        run: |
          curl -s "https://shion.dev" > stats.svg

      - name: Baixar Gráfico de Linguagens
        run: |
          curl -s "https://shion.dev" > langs.svg

      - name: Salvar arquivos no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg langs.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update stats" && git push)
